<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Armor of God: Daily Watchfulness</title>
<meta name="description" content="A 2D tactical readiness and daily spiritual battle game grounded in Ephesians 6:10-18." />
<meta name="theme-color" content="#0a0e1a" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; font-src data:; media-src 'none'; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="mobile-web-app-capable" content="yes" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230d1426'/%3E%3Cpath d='M32 10l16 6v14c0 12-7 20-16 24-9-4-16-12-16-24V16z' fill='none' stroke='%23e8c46a' stroke-width='3'/%3E%3Cpath d='M32 22v18M23 31h18' stroke='%23e8c46a' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="css/theme.css" />
<link rel="stylesheet" href="css/layout.css" />
<link rel="stylesheet" href="css/components.css" />
</head>
<body>
  <div id="app">
    <div id="scene" class="scene" aria-hidden="true">
      <div class="scene-glow"></div>
      <div class="scene-stars"></div>
      <div class="scene-horizon"></div>
    </div>

    <canvas id="arena" class="arena" aria-label="Spiritual battle arena"></canvas>

    <div id="battle-ui" class="battle-ui is-hidden" aria-hidden="true"></div>

    <main id="screen-layer" class="screen-layer" role="main"></main>

    <div id="overlay" class="overlay" aria-live="polite"></div>
    <div id="toasts" class="toasts" aria-live="polite" aria-atomic="false"></div>
    <div id="flash" class="flash" aria-hidden="true"></div>
  </div>

  <script type="module" src="js/main.js"></script>
  <noscript>
    <div style="position:fixed;inset:0;display:grid;place-items:center;background:#0a0e1a;color:#e8eaf2;font:16px system-ui;padding:2rem;text-align:center">
      Armor of God: Daily Watchfulness needs JavaScript enabled to run.
    </div>
  </noscript>
  <script>
    if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () {});
      });
    }
  </script>
</body>
</html>
